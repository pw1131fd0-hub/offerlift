version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: offerlift-postgres
    environment:
      POSTGRES_USER: offerlift
      POSTGRES_PASSWORD: offerlift_dev_password
      POSTGRES_DB: offerlift
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerlift"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: offerlift-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offerlift-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://offerlift:offerlift_dev_password@postgres:5432/offerlift
      REDIS_URL: redis://redis:6379
      API_KEY: dev_api_key_12345
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - ./index.html:/app/index.html

volumes:
  postgres_data:
  redis_data:
